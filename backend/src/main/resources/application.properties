micronaut.application.name=conference-backend
micronaut.server.port=8080

datasources.default.url=${DB_URL:`jdbc:postgresql://localhost:5432/conference`}
datasources.default.username=${DB_USER:conference}
datasources.default.password=${DB_PASSWORD:conference}
datasources.default.db-type=postgres
datasources.default.dialect=POSTGRES
datasources.default.driver-class-name=org.postgresql.Driver

flyway.datasources.default.enabled=true

langchain4j.anthropic.api-key=${ANTHROPIC_API_KEY:}
langchain4j.anthropic.model-name=claude-haiku-4-5
langchain4j.anthropic.timeout=60s
langchain4j.anthropic.chat-model.temperature=0
langchain4j.anthropic.chat-model.max-tokens=1024
langchain4j.chat-memory-store.message-window.max-messages=20
